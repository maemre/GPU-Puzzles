[project]
name = "gpu-puzzles"
version = "0.1.0"
description = "GPU programming exercises with CPU CUDA simulation"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "chalk-diagrams",
    "chalk-planar",
    "colour>=0.1.5",
    "ipykernel>=6",
    "jupyterlab>=4,<5",
    "nbconvert>=7,<8",
    "numba>=0.60,<0.62",
    "numpy>=1.26,<2.3",
]

[tool.uv]
package = false

[tool.uv.sources]
chalk-diagrams = { git = "https://github.com/danoneata/chalk", branch = "srush-patch-1" }
chalk-planar = { git = "https://github.com/chalk-diagrams/planar" }
